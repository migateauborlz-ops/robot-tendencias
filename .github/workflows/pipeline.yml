name: Pipeline de deteccion

# Orquestacion del robot (OE4).
#
# A diferencia de las pruebas, esta ejecucion CUESTA DINERO: consume creditos
# de Apify por cada publicacion raspada. Por eso el disparo programado esta
# desactivado de fabrica: la corrida semanal solo ocurre si en el repositorio
# existe la variable EJECUCION_PROGRAMADA con valor 'true'
# (Settings > Secrets and variables > Actions > Variables). La ejecucion
# manual, en cambio, siempre esta disponible.
on:
  workflow_dispatch:
    inputs:
      consultas:
        description: 'Hashtags a rastrear, separados por espacios'
        required: false
        default: '#TikTokMadeMeBuyIt #ProductosVirales'
      items:
        description: 'Publicaciones por consulta (controla el costo)'
        required: false
        default: '30'
      top_n:
        description: 'Productos a guardar'
        required: false
        default: '10'
  schedule:
    # Lunes 06:00 UTC = 01:00 en Bogota.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # La ejecucion manual siempre procede. La programada requiere que el equipo
    # haya activado explicitamente la variable, para que nadie descubra el
    # consumo de creditos despues del hecho.
    if: >
      github.event_name == 'workflow_dispatch' ||
      vars.EJECUCION_PROGRAMADA == 'true'

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Verificar que el token existe
        # Sin esta comprobacion el pipeline arranca, raspa cero publicaciones y
        # termina "sin errores", que es la falla mas dificil de diagnosticar.
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          if [ -z "$APIFY_API_TOKEN" ]; then
            echo "::error::Falta el secreto APIFY_API_TOKEN."
            exit 1
          fi
          echo "Token presente."

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          python -m spacy download es_core_news_sm
          python -m spacy download en_core_web_sm

      - name: Ejecutar el pipeline
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          DB_PATH: sqlite:///data/trends.db
          PYTHONIOENCODING: utf-8
          # Las entradas del formulario se pasan por el entorno, nunca
          # interpoladas con ${{ }} dentro del script. Por dos razones:
          # interpolarlas inyecta texto arbitrario en el shell, y ademas
          # romperia la ejecucion, porque bash leeria el '#' de un hashtag como
          # el inicio de un comentario y descartaria el resto de la linea. El
          # valor que llega por expansion de variable no se vuelve a analizar en
          # busca de comentarios.
          # Se usa github.event.inputs y no el contexto `inputs`: este workflow
          # tambien responde a `schedule`, y en esa combinacion `inputs` no es
          # un nombre reconocido, lo que invalida el archivo entero. En una
          # corrida programada github.event.inputs es nulo y aplica el valor
          # por defecto.
          CONSULTAS: ${{ github.event.inputs.consultas || '#TikTokMadeMeBuyIt #ProductosVirales' }}
          ITEMS: ${{ github.event.inputs.items || '30' }}
          TOP_N: ${{ github.event.inputs.top_n || '10' }}
        run: |
          mkdir -p data
          # $CONSULTAS va sin comillas a proposito: cada hashtag debe llegar
          # como un argumento separado de --queries.
          python main.py \
            --queries $CONSULTAS \
            --items "$ITEMS" \
            --top_n "$TOP_N"

      - name: Exportar resultados
        if: always()
        env:
          DB_PATH: sqlite:///data/trends.db
        run: python exportar_resultados.py --salida resultados.csv

      - name: Resumen de la corrida
        if: always()
        run: |
          {
            echo "## Resultado de la deteccion"
            echo ""
            if [ -s resultados.csv ]; then
              echo '```'
              head -20 resultados.csv
              echo '```'
            else
              echo "No se genero ningun resultado."
            fi
            echo ""
            echo "### Ultimas lineas del log"
            echo '```'
            tail -25 pipeline.log 2>/dev/null || echo "sin log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ github.run_number }}
          # Se publican el CSV y el log, NUNCA data/trends.db. La base incluye
          # la tabla raw_social_data, con comentarios raspados y los
          # identificadores de las publicaciones de las que salieron; subirla
          # como artefacto trasladaria esos datos personales al almacenamiento
          # de GitHub. El log solo registra conteos y nombres de producto, y el
          # CSV solo metricas agregadas.
          path: |
            resultados.csv
            pipeline.log
          retention-days: 14
          if-no-files-found: warn
